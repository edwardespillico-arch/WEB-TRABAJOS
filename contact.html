<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portafolio - Contacto</title>
    
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/_layout.css">
    <link rel="stylesheet" href="css/_modules.css">
</head>
<body>
    <nav class="main-nav full-width-section">
        <div class="nav-content">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="about.html">Conoceme</a></li>
                <li><a href="projects.html">Proyectos</a></li>
                <li><a href="contact.html" class="nav-active">Contactos</a></li>
            </ul>
        </div>
    </nav>
    
    <header class="main-header full-width-section">
        <div class="header-content">
            <h1 class="main-title"> Comunicate Conmigo </h1>
            <p class="header-description">Estoy disponible para nuevos proyectos y colaboraciones</p>
        </div>
    </header>

    <div class="page-wrapper">
        <div class="contenedor-principal">
            
            <section class="module-card neumorphic-card contact-section">
                <h2 class="section-title">Envíame un mensaje</h2>
                
                <form class="contact-form">
                    <div class="form-group">
                        <label for="nombre">Nombre Completo</label>
                        <input type="text" id="nombre" name="nombre" class="neumorphic-input" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" class="neumorphic-input" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="mensaje">Tu Mensaje</label>
                        <textarea id="mensaje" name="mensaje" rows="6" class="neumorphic-input" required></textarea>
                    </div>
                    
                    <button type="submit" class="btn-neumorphic btn-submit tag-accent-1">Enviar Ahora</button>
                </form>
            </section>
            
            <section class="social-links-section neumorphic-card">
                <h2 class="section-title">O Contáctame por Redes</h2>
                <div class="social-links">
                    <a href="#" class="social-link btn-neumorphic" style="color: #0077b5;">FACEBOOK </a>
                    <a href="#" class="social-link btn-neumorphic" style="color: #24292e;">TWTITTER</a>
                    <a href="#" class="social-link btn-neumorphic" style="color: #e74c3c;">Email</a>
                </div>
            </section>

        </div>
    </div>
    
    <footer class="main-footer full-width-section">
        <p>Diseño y Desarrollo por [Edward Omar Espillico Chucuya ] | &copy; 2025</p>
    </footer>
</body>
</html>
